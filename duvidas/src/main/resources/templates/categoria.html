<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Java FullStack - Duvida e Categoria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0d4c;
            color: #fff;
            padding: 24px;
        }

        h1 {
            text-align: center;
        }

        .faq {
            max-width: 720px;
            margin: 0 auto;
        }

        details {
            background: #141a6b;
            border: 2px solid #4da3ff;
            border-radius: 12px;
            margin-bottom: 12px;
            padding: 14px 18px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
        }

        .info {
            margin: 10px 0 0;
            color: #9fc4ff;
            font-size: 14px;
        }

        .resp {
            margin: 8px 0 0;
            color: #cfe6ff;
        }


        .btn-excluir {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-excluir:hover {
            background: #b02a37;
        }
    </style>
</head>

<body>
    <h1>FAQ Java FullStack</h1>
    <div class="faq">
        

            <form th:action="@{/categoria/cadastrar}" method="post"> 
                <input type="hidden" name="id" th:value="${d.id}"> 
                <button type="submit" class="btn btn-danger btn-sm">Cadastrar</button> 
            </form> 



    </div>
</body>

</html>
